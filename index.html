<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#ffe9f0">
<title>Только для тебя</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 28C4 19 2 13 2 9a7 7 0 0 1 14-2 7 7 0 0 1 14 2c0 4-2 10-14 19z' fill='%23f28aab'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="sky" aria-hidden="true"></div>

<main id="lock" class="screen">
  <div class="lock-card">
    <div class="lock-bears" id="lockBears"></div>
    <h1>Это только для тебя</h1>
    <p class="lock-sub">Здесь кое-что, что я делал очень долго.</p>
    <form id="lockForm" autocomplete="off">
      <input id="pass" type="password" inputmode="text" placeholder="пароль" aria-label="пароль" autocapitalize="off" spellcheck="false">
      <button type="submit" id="unlockBtn">Открыть</button>
    </form>
    <p class="hint" id="hint"></p>
    <p class="err" id="err" role="status"></p>
  </div>
</main>

<main id="envelope" class="screen hidden">
  <button class="env" id="envBtn" aria-label="Открыть письмо">
    <span class="env-back"></span>
    <span class="env-letter"><span>тебе</span></span>
    <span class="env-front"></span>
    <span class="env-flap"></span>
    <span class="env-seal">♥</span>
  </button>
  <p class="env-tap">нажми на конверт</p>
</main>

<main id="story" class="hidden">
  <div class="progress" id="progress"></div>
  <div class="track" id="track"></div>
  <nav class="nav">
    <button id="prev" aria-label="Назад">‹</button>
    <span id="count"></span>
    <button id="next" aria-label="Дальше">›</button>
  </nav>
  <p class="swipe-tip" id="swipeTip">листай →</p>
</main>

<div id="finale" class="hidden" role="dialog" aria-modal="true"></div>
<div id="lightbox" class="hidden" role="dialog" aria-modal="true"><img alt=""><p></p></div>

<script src="app.js"></script>
</body>
</html>
